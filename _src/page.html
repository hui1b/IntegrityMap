<script>
  function initYear() {
    var curYear = new Date().getFullYear()
    var yHtml = '<div class="selectli on" attr="" onClick="selectLi(this)">全部</div>'
    for (var i = 0; i < curYear - 2024; i++) {
      var num = Number(curYear) - i
      yHtml += '<div class="selectli" attr="' + num + '" onClick="selectLi(this)">' + num + "</div>"
    }
    $(".YearSelectUl").html(yHtml)
  }

  function selectLi(e) {
    var txt = $(e).text()
    var status = $(e).attr("attr")
    $(e).addClass("on").siblings().removeClass("on")
    $(e).parents(".selectbox").find(".selectShow").html(txt).attr("status", status)
    getMapIndex()
  }

  $(".selectbox").click(function (e) {
    e.stopPropagation()
    $(this).toggleClass("on")
  })
  $(document).click(function (e) {
    e.stopPropagation()
    if ($(".selectbox").hasClass("on")) {
      $(".selectbox").removeClass("on")
    }
  })

  $(function () {
    initYear()
  })
</script>
